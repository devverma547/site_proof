      <text x="214" y="873" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">CTA flow is weaker on small screens</text>
      <text x="214" y="903" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Impact: conversion drops on the most important devices.</text>
